<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.08) translate(-10px, 10px); opacity: 0.7; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) opacity(0.3); }
      50% { transform: translateY(-15px) opacity(0.8); }
      100% { transform: translateY(0px) opacity(0.3); }
    }
    @keyframes waveMotion {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 1000; }
    }
    .bg-circle { transform-origin: center; animation: pulseGlow 8s ease-in-out infinite; }
    .particle { animation: floatParticle 4s ease-in-out infinite; }
    .particle-delay-1 { animation-delay: 1s; }
    .particle-delay-2 { animation-delay: 2s; }
    .particle-delay-3 { animation-delay: 3s; }
    .wave-line { stroke-dasharray: 20 10; animation: waveMotion 25s linear infinite; }
    .main-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 46px; fill: url(#titleGrad); }
    .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 20px; fill: #e2e8f0; letter-spacing: 0.5px; }
    .badge-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>

  <!-- Dynamic Glowing Background Circles (Behind Text) -->
  <circle class="bg-circle" cx="200" cy="100" r="180" fill="url(#glowGrad)"/>
  <circle class="bg-circle" cx="1000" cy="260" r="220" fill="url(#glowGrad)" style="animation-delay: 4s;"/>

  <!-- Dynamic Background Grid / Wave Lines -->
  <path class="wave-line" d="M 0 280 Q 300 220 600 280 T 1200 280" fill="none" stroke="#4f46e5" stroke-opacity="0.25" stroke-width="2"/>
  <path class="wave-line" d="M 0 310 Q 300 250 600 310 T 1200 310" fill="none" stroke="#818cf8" stroke-opacity="0.2" stroke-width="1.5" style="animation-duration: 35s;"/>

  <!-- Floating Particles -->
  <circle class="particle particle-delay-1" cx="150" cy="80" r="4" fill="#38bdf8"/>
  <circle class="particle particle-delay-2" cx="1050" cy="90" r="5" fill="#c084fc"/>
  <circle class="particle particle-delay-3" cx="920" cy="300" r="4" fill="#818cf8"/>
  <circle class="particle particle-delay-1" cx="100" cy="290" r="3" fill="#a855f7"/>

  <!-- FOREGROUND CONTENT CARD (Ensures high contrast & readable text) -->
  <g filter="url(#shadow)">
    <!-- Category Pill Tag -->
    <rect x="80" y="60" width="310" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="235" y="82" text-anchor="middle" class="badge-text">📊 AWESOME CURATED COLLECTION</text>

    <!-- Main Title -->
    <text x="80" y="150" class="main-title">Awesome Online Survey Software</text>

    <!-- Subtitle Description -->
    <text x="80" y="195" class="subtitle">Top Commercial SaaS &amp; Open-Source Survey Tools, Form Builders &amp; Data Platforms</text>
    <text x="80" y="225" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">Self-Hosted Alternatives • Enterprise Analytics • Field Research • GDPR Privacy-First Solutions</text>

    <!-- Bottom Highlights Bar -->
    <g transform="translate(80, 265)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="180" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="90" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#cbd5e1">⚡ LimeSurvey &amp; Formbricks</text>

      <!-- Item 2 -->
      <rect x="195" y="0" width="180" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="285" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#cbd5e1">🔒 Self-Hosted &amp; Privacy</text>

      <!-- Item 3 -->
      <rect x="390" y="0" width="180" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="480" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#cbd5e1">📈 2026 SaaS Pricing</text>
    </g>
  </g>
</svg>
